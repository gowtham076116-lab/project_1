<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HIVE CITY Admin Control Centre</title>
    <link rel="icon" type="image/png" href="/favicon-round.png?v=2" />
    <link rel="shortcut icon" type="image/png" href="/favicon-round.png?v=2" />
    <link rel="apple-touch-icon" href="/hivecity-logo-square.png?v=2" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F2F0E9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Chakra+Petch:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet" />
    <script>(() => {
      try {
        var k = localStorage.getItem('hv-theme') || localStorage.getItem('theme');
        var t = k || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
        var r = document.documentElement;
        r.dataset.theme = t;
        r.style.colorScheme = t;
        if (t === 'dark') {
          r.classList.add('dark');
        } else {
          r.classList.remove('dark');
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })()</script>
  </head>

  <body>
    <div id="root"></div>
    <script src="/api/platform/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
